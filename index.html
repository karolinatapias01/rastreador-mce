<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rastreador MCE</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:linear-gradient(135deg,#003366,#0052cc);min-height:100vh;padding:20px;color:#1f2937}.container{width:100%;max-width:1200px;margin:0 auto}.header{background:linear-gradient(135deg,#003366,#0052cc);color:#fff;padding:18px 22px;border-radius:14px 14px 0 0;display:flex;justify-content:space-between;align-items:center;gap:15px}.header-title{font-size:25px;font-weight:800}.header-user{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.15);padding:8px 12px;border-radius:8px}.panel{background:#fff;border-radius:0 0 14px 14px;padding:24px;box-shadow:0 20px 30px rgba(0,0,0,.14)}.auth-panel{border-radius:14px}.auth-container{max-width:420px;margin:auto}.tab-buttons{display:flex;gap:5px;margin-bottom:22px;border-bottom:2px solid #e5e7eb}.tab{padding:12px 18px;border:0;background:none;cursor:pointer;font-weight:700;color:#6b7280;border-bottom:3px solid transparent}.tab.active{color:#003366;border-bottom-color:#003366}.form-group{margin-bottom:15px}.form-group label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.form-group input,.input{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:7px;font-size:14px;font-family:inherit}.form-group input:focus,.input:focus{outline:none;border-color:#0052cc;box-shadow:0 0 0 3px rgba(0,82,204,.1)}.btn{background:#003366;color:#fff;border:0;padding:10px 15px;border-radius:7px;cursor:pointer;font-weight:700;font-size:13px}.btn:hover{background:#00264d}.btn-danger{background:#dc2626}.btn-danger:hover{background:#991b1b}.btn-success{background:#059669}.btn-success:hover{background:#047857}.btn-secondary{background:#64748b}.btn-secondary:hover{background:#475569}.btn-primary{width:100%;background:#003366;color:#fff;border:0;padding:12px;border-radius:7px;font-weight:700;cursor:pointer;font-size:14px}.error{font-size:13px;margin-top:7px;color:#dc2626}.success{font-size:13px;margin-top:7px;color:#059669}.top-actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.section-title{font-size:21px;font-weight:800;margin-bottom:15px}.admin-tabs{display:flex;gap:8px;margin-bottom:20px;border-bottom:2px solid #e5e7eb}.admin-tab{border:0;background:#f1f5f9;padding:11px 16px;border-radius:7px 7px 0 0;cursor:pointer;font-weight:700;color:#475569}.admin-tab.active{background:#003366;color:#fff}.res-item{background:#f9fafb;border:1px solid #e5e7eb;border-radius:10px;padding:17px;margin-bottom:14px}.res-header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}.res-num{font-weight:800;color:#003366;font-size:17px}.res-estab{color:#475569;font-size:14px;margin-top:4px}.res-paso{font-size:16px;font-weight:800;color:#059669;margin:10px 0}.res-fecha{font-size:13px;color:#64748b;margin-bottom:10px}.pasos-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:15px}.paso{background:#fff;border:2px solid #e5e7eb;padding:13px 8px;border-radius:9px;text-align:center;cursor:pointer;transition:.2s;min-height:92px;display:flex;flex-direction:column;align-items:center;justify-content:center}.paso:hover{border-color:#0052cc;background:#f0f6ff;transform:translateY(-1px)}.paso.active{background:#003366;color:#fff;border-color:#003366;box-shadow:0 5px 12px rgba(0,51,102,.2)}.paso-icon{font-size:25px;margin-bottom:5px}.paso-name{font-size:13px;font-weight:800;line-height:1.15}.paso-date{font-size:11px;margin-top:6px;opacity:.8}.readonly{background:#f0fdf4;border:1px solid #bbf7d0}.user-card,.pending-card{border:1px solid #e5e7eb;border-radius:10px;padding:15px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:15px}.user-info strong{display:block;font-size:15px}.user-info span{font-size:13px;color:#64748b}.user-actions{display:flex;gap:7px;flex-wrap:wrap}.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800}.badge-admin{background:#dbeafe;color:#1d4ed8}.badge-user{background:#dcfce7;color:#166534}.badge-pending{background:#fef3c7;color:#92400e}.empty{text-align:center;padding:40px 20px;color:#9ca3af}.notif{position:fixed;top:20px;right:20px;background:#059669;color:#fff;padding:12px 18px;border-radius:7px;font-size:14px;z-index:9999;box-shadow:0 8px 20px rgba(0,0,0,.2)}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9998;justify-content:center;align-items:center;padding:20px}.modal.show{display:flex}.modal-content{background:#fff;border-radius:12px;padding:23px;max-width:650px;width:100%;max-height:90vh;overflow-y:auto}.modal-title{font-size:20px;font-weight:800;margin-bottom:17px}.modal-actions{display:flex;gap:8px;margin-top:15px}.history-item{position:relative;border-left:3px solid #0052cc;padding:0 0 15px 18px;margin-left:7px}.history-item:last-child{padding-bottom:0}.history-dot{position:absolute;left:-8px;top:0;width:12px;height:12px;border-radius:50%;background:#0052cc}.history-title{font-weight:800}.history-meta{font-size:12px;color:#64748b;margin-top:3px}.admin-note{background:#eff6ff;border:1px solid #bfdbfe;padding:12px;border-radius:8px;font-size:13px;margin-bottom:16px}@media(max-width:800px){.pasos-grid{grid-template-columns:repeat(2,1fr)}.header{flex-direction:column;align-items:flex-start}.user-card,.pending-card{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>
<div class="container">
<div class="header" id="header" style="display:none"><div class="header-title">🔴 Rastreador MCE</div><div class="header-user"><span id="userDisplay">-</span><button class="btn btn-danger" onclick="logout()">Cerrar</button></div></div>
<div class="panel auth-panel" id="authPanel"><div class="auth-container"><div class="tab-buttons"><button class="tab active" onclick="mostrarLogin()">🔐 Ingresar</button><button class="tab" onclick="mostrarRegistro()">📝 Registrarse</button></div><div id="loginForm"><div class="form-group"><label>Usuario</label><input type="text" id="loginUser" placeholder="Tu usuario"></div><div class="form-group"><label>Contraseña</label><input type="password" id="loginPass" placeholder="Tu contraseña"></div><div class="error" id="loginError"></div><button class="btn-primary" onclick="login()">🔐 Ingresar</button></div><div id="registroForm" style="display:none"><div class="form-group"><label>Nombre completo</label><input type="text" id="regNombre" placeholder="Tu nombre"></div><div class="form-group"><label>Usuario</label><input type="text" id="regUser" placeholder="Tu usuario"></div><div class="form-group"><label>Contraseña</label><input type="password" id="regPass" placeholder="Mínimo 6 caracteres"></div><div class="error" id="regError"></div><button class="btn-primary" onclick="registrar()">✅ Registrarse</button></div></div></div>
<div class="panel" id="appPanel" style="display:none"><div id="adminPanel" style="display:none"><div class="admin-tabs"><button class="admin-tab active" id="tabResoluciones" onclick="mostrarSeccionAdmin('resoluciones')">📋 Resoluciones</button><button class="admin-tab" id="tabUsuarios" onclick="mostrarSeccionAdmin('usuarios')">👥 Usuarios</button></div><div id="adminResoluciones"><div class="top-actions"><button class="btn" onclick="abrirModalNueva()">➕ Nueva Resolución</button></div></div><div id="adminUsuarios" style="display:none"><div class="admin-note">Aquí puedes aprobar solicitudes, editar nombres y eliminar usuarios. Tu propia cuenta no se puede eliminar desde esta pantalla.</div><h3 style="margin-bottom:10px">⏳ Solicitudes pendientes</h3><div id="pendientesLista"></div><h3 style="margin:20px 0 10px">👥 Usuarios registrados</h3><div id="usuariosLista"></div></div></div><div id="vistaResoluciones"><input type="text" class="input" id="busqueda" placeholder="🔍 Buscar por número o establecimiento..." onkeyup="renderizar()"><div id="lista" style="margin-top:16px"></div></div></div>
</div>

<div class="modal" id="modalNueva"><div class="modal-content"><div class="modal-title">📋 Nuevo establecimiento</div><div class="form-group"><label>Establecimiento</label><input type="text" id="newEstab" placeholder="Nombre del establecimiento"></div><div class="modal-actions"><button class="btn btn-success" onclick="crearResolucion()">✅ Crear</button><button class="btn btn-secondary" onclick="cerrarModalNueva()">Cancelar</button></div></div></div>
<div class="modal" id="modalEditarEstablecimiento"><div class="modal-content"><div class="modal-title">✏️ Editar establecimiento</div><div class="form-group"><label>Establecimiento</label><input type="text" id="editEstab" placeholder="Nombre correcto"></div><div class="modal-actions"><button class="btn btn-success" onclick="guardarEstablecimiento()">💾 Guardar</button><button class="btn btn-secondary" onclick="cerrarModalEditarEstablecimiento()">Cancelar</button></div></div></div>
<div class="modal" id="modalEditarUsuario"><div class="modal-content"><div class="modal-title">✏️ Editar usuario</div><div class="form-group"><label>Usuario</label><input type="text" id="editUser" disabled></div><div class="form-group"><label>Nombre completo</label><input type="text" id="editNombre" placeholder="Nombre correcto"></div><div class="modal-actions"><button class="btn btn-success" onclick="guardarNombreUsuario()">💾 Guardar</button><button class="btn btn-secondary" onclick="cerrarModalEditar()">Cancelar</button></div></div></div>
<div class="modal" id="modalHistorial"><div class="modal-content"><div class="modal-title" id="historialTitulo">📜 Historial</div><div id="historialContenido"></div><div class="modal-actions"><button class="btn btn-secondary" onclick="cerrarModalHistorial()">Cerrar</button></div></div></div>

<script>
const config={apiKey:"AIzaSyCEvPVfN3-X4PIOfdwjgCHJB-D3bzndzHo",authDomain:"rastreador-mce-a3773.firebaseapp.com",databaseURL:"https://rastreador-mce-a3773-default-rtdb.firebaseio.com",projectId:"rastreador-mce-a3773",storageBucket:"rastreador-mce-a3773.firebasestorage.app",messagingSenderId:"998173497581",appId:"1:998173497581:web:721f95ce0785f3dccad4e4"};
firebase.initializeApp(config);
const db=firebase.database();
let usuarios={},pendientes={},resoluciones=[],usuarioActual=null,usuarioEditando=null,establecimientoEditando=null;

const PASOS=[{num:0,nombre:"Omar sin elaborar",icon:"👨"},{num:1,nombre:"Doctor Nilson",icon:"📋"},{num:2,nombre:"Dirección",icon:"📂"},{num:3,nombre:"Despacho",icon:"💼"},{num:4,nombre:"Numeración",icon:"🔢"},{num:5,nombre:"Secretaría",icon:"🏛️"},{num:6,nombre:"Por Notificar",icon:"📧"},{num:7,nombre:"Notificada",icon:"✅"}];

db.ref("rastreador/usuarios").on("value",s=>{usuarios=s.val()||{};renderizarUsuarios();});
db.ref("rastreador/pendientes").on("value",s=>{pendientes=s.val()||{};renderizarPendientes();});
db.ref("rastreador/resoluciones").on("value",s=>{resoluciones=s.val()||[];if(!Array.isArray(resoluciones))resoluciones=Object.values(resoluciones);resoluciones=resoluciones.map(r=>({...r,id:r.id||null,fechas:r.fechas||{},autores:r.autores||{},historial:Array.isArray(r.historial)?r.historial:[]}));renderizar();});

function ahora(){const d=new Date();return `${String(d.getDate()).padStart(2,"0")}-${String(d.getMonth()+1).padStart(2,"0")}-${d.getFullYear()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}:${String(d.getSeconds()).padStart(2,"0")}`;}
function esAdmin(){return !!(usuarioActual&&usuarios[usuarioActual]&&usuarios[usuarioActual].rol==="admin");}
function registrar(){const nombre=document.getElementById("regNombre").value.trim();const usuario=document.getElementById("regUser").value.trim().toLowerCase();const pass=document.getElementById("regPass").value;const error=document.getElementById("regError");error.style.color="#dc2626";error.textContent="";if(!nombre||!usuario||!pass){error.textContent="❌ Completa todos los campos";return}if(pass.length<6){error.textContent="❌ Contraseña mínimo 6 caracteres";return}if(usuarios[usuario]||pendientes[usuario]){error.textContent="❌ Este usuario ya existe";return}if(Object.keys(usuarios).length===0&&Object.keys(pendientes).length===0){usuarios[usuario]={nombre,pass,rol:"admin"};db.ref("rastreador/usuarios").set(usuarios);error.style.color="#059669";error.textContent="✅ ¡Eres ADMINISTRADOR! Inicia sesión";}else{pendientes[usuario]={nombre,pass};db.ref("rastreador/pendientes").set(pendientes);error.style.color="#f59e0b";error.textContent="⏳ Solicitud enviada. Espera aprobación del administrador";}setTimeout(()=>mostrarLogin(),1600);}
function login(){const usuario=document.getElementById("loginUser").value.trim().toLowerCase();const pass=document.getElementById("loginPass").value;const error=document.getElementById("loginError");error.textContent="";if(!usuario||!pass){error.textContent="❌ Completa usuario y contraseña";return}if(pendientes[usuario]){error.textContent="⏳ Solicitud PENDIENTE de aprobación";return}if(!usuarios[usuario]||usuarios[usuario].pass!==pass){error.textContent="❌ Usuario o contraseña incorrectos";return}usuarioActual=usuario;mostrarApp();}
function logout(){usuarioActual=null;document.getElementById("header").style.display="none";document.getElementById("appPanel").style.display="none";document.getElementById("authPanel").style.display="block";mostrarLogin();}
function mostrarLogin(){document.getElementById("loginForm").style.display="block";document.getElementById("registroForm").style.display="none";document.querySelectorAll(".tab")[0].classList.add("active");document.querySelectorAll(".tab")[1].classList.remove("active");}
function mostrarRegistro(){document.getElementById("loginForm").style.display="none";document.getElementById("registroForm").style.display="block";document.querySelectorAll(".tab")[0].classList.remove("active");document.querySelectorAll(".tab")[1].classList.add("active");}
function mostrarApp(){document.getElementById("authPanel").style.display="none";document.getElementById("header").style.display="flex";document.getElementById("appPanel").style.display="block";document.getElementById("userDisplay").textContent=usuarios[usuarioActual].nombre+(esAdmin()?" · ADMIN":"");document.getElementById("adminPanel").style.display=esAdmin()?"block":"none";if(esAdmin())mostrarSeccionAdmin("resoluciones");renderizar();}
function mostrarSeccionAdmin(sec){if(!esAdmin())return;const usuariosSec=sec==="usuarios";document.getElementById("adminUsuarios").style.display=usuariosSec?"block":"none";document.getElementById("adminResoluciones").style.display=usuariosSec?"none":"block";document.getElementById("vistaResoluciones").style.display=usuariosSec?"none":"block";document.getElementById("tabUsuarios").classList.toggle("active",usuariosSec);document.getElementById("tabResoluciones").classList.toggle("active",!usuariosSec);if(usuariosSec){renderizarPendientes();renderizarUsuarios();}}

function renderizar(){const lista=document.getElementById("lista");if(!lista)return;const busqueda=(document.getElementById("busqueda")?.value||"").toLowerCase();const filtradas=resoluciones.filter(r=>String(r.numero||"").toLowerCase().includes(busqueda)||String(r.estab||"").toLowerCase().includes(busqueda));if(!usuarioActual){lista.innerHTML="";return}if(!filtradas.length){lista.innerHTML='<div class="empty">📝 Sin resoluciones</div>';return}lista.innerHTML=filtradas.map(r=>{const paso=PASOS.find(p=>p.num===Number(r.paso))||PASOS[0];const fecha=r.fechas?.[r.paso]||"-";if(!esAdmin()){return `<div class="res-item readonly"><div class="res-header"><div><div class="res-estab" style="font-size:17px;font-weight:800;color:#003366">${esc(r.estab)}</div></div></div><div class="res-paso">${paso.icon} ${paso.nombre}</div><div class="res-fecha">🕒 Último movimiento: ${esc(fecha)}</div></div>`;}const rid=safe(r.id||r.numero);return `<div class="res-item"><div class="res-header"><div><div class="res-estab" style="font-size:17px;font-weight:800;color:#003366">${esc(r.estab)}</div></div><div class="user-actions"><button class="btn btn-secondary" onclick="abrirEditarEstablecimiento('${rid}')">✏️ Editar</button><button class="btn btn-secondary" onclick="verHistorial('${rid}')">📜 Historial</button></div></div><div class="res-paso">${paso.icon} ${paso.nombre}</div><div class="res-fecha">🕒 Último movimiento: ${esc(fecha)}</div><div class="pasos-grid">${PASOS.map(p=>{const f=r.fechas?.[p.num]||"";return `<div class="paso ${p.num===Number(r.paso)?"active":""}" onclick="cambiarPaso('${rid}',${p.num})" title="Seleccionar ${esc(p.nombre)}"><div class="paso-icon">${p.icon}</div><div class="paso-name">${esc(p.nombre)}</div>${f?`<div class="paso-date">🕒 ${esc(f)}</div>`:"" }</div>`;}). join("")}</div></div>`;}).join("");}

function crearResolucion(){try{const estab=document.getElementById("newEstab").value.trim();if(!estab){mostrarNotif("❌ Escribe el nombre del establecimiento");return}if(!usuarioActual||!usuarios[usuarioActual]){mostrarNotif("❌ Debes estar logueado");return}const fecha=ahora(),nombre=usuarios[usuarioActual].nombre,id=Date.now().toString(),nueva={id,numero:"RES-"+id.slice(-6),estab,paso:0,fechas:{0:fecha},autores:{0:nombre},historial:[{paso:0,nombrePaso:"Omar sin elaborar",fecha,usuario:nombre,accion:"Creación"}]};if(!Array.isArray(resoluciones))resoluciones=[];resoluciones.push(nueva);db.ref("rastreador/resoluciones").set(resoluciones).then(()=>{document.getElementById("newEstab").value="";cerrarModalNueva();mostrarNotif("✅ Establecimiento creado");}).catch(err=>{console.error(err);mostrarNotif("❌ "+err.message);});}catch(e){console.error(e);mostrarNotif("❌ Error: "+e.message);}}

function cambiarPaso(id,paso){if(!esAdmin())return;const r=buscarResolucion(id);if(!r)return;const fecha=ahora(),nombre=usuarios[usuarioActual].nombre,p=PASOS.find(x=>x.num===paso);if(!p)return;r.paso=paso;r.fechas=r.fechas||{};r.autores=r.autores||{};r.historial=Array.isArray(r.historial)?r.historial:[];r.fechas[paso]=fecha;r.autores[paso]=nombre;r.historial.push({paso,nombrePaso:p.nombre,fecha,usuario:nombre,accion:"Cambio de paso"});db.ref("rastreador/resoluciones").set(resoluciones).then(()=>mostrarNotif(`✅ ${p.nombre} · ${fecha}`)).catch(err=>{console.error(err);mostrarNotif("❌ "+err.message);});}

function renderizarPendientes(){const el=document.getElementById("pendientesLista");if(!el)return;const keys=Object.keys(pendientes);if(!keys.length){el.innerHTML='<div class="empty">No hay solicitudes pendientes.</div>';return}el.innerHTML=keys.map(u=>`<div class="pending-card"><div class="user-info"><strong>${esc(pendientes[u].nombre)}</strong><span>@${esc(u)} · <span class="badge badge-pending">PENDIENTE</span></span></div><div class="user-actions"><button class="btn btn-success" onclick="aprobarUsuario('${safe(u)}')">✅ Aprobar</button><button class="btn btn-danger" onclick="rechazarUsuario('${safe(u)}')">🗑️ Rechazar</button></div></div>`).join("");}
function renderizarUsuarios(){const el=document.getElementById("usuariosLista");if(!el)return;const keys=Object.keys(usuarios);if(!keys.length){el.innerHTML='<div class="empty">No hay usuarios.</div>';return}el.innerHTML=keys.map(u=>{const admin=usuarios[u].rol==="admin";return `<div class="user-card"><div class="user-info"><strong>${esc(usuarios[u].nombre)}</strong><span>@${esc(u)} · <span class="badge ${admin?"badge-admin":"badge-user"}">${admin?"ADMIN":"USUARIO"}</span></span></div><div class="user-actions"><button class="btn btn-secondary" onclick="abrirEditarUsuario('${safe(u)}')">✏️ Editar nombre</button>${u!==usuarioActual?`<button class="btn btn-danger" onclick="eliminarUsuario('${safe(u)}')">🗑️ Eliminar</button>`:"<span style='font-size:12px;color:#64748b'>Tu cuenta</span>"}</div></div>`;}). join("");}

function aprobarUsuario(u){if(!esAdmin()||!pendientes[u])return;usuarios[u]={nombre:pendientes[u].nombre,pass:pendientes[u].pass,rol:"user"};delete pendientes[u];db.ref("rastreador/usuarios").set(usuarios);db.ref("rastreador/pendientes").set(pendientes);mostrarNotif("✅ Usuario aprobado");}
function rechazarUsuario(u){if(!esAdmin()||!pendientes[u])return;if(!confirm(`¿Rechazar la solicitud de ${pendientes[u].nombre}?`))return;delete pendientes[u];db.ref("rastreador/pendientes").set(pendientes);mostrarNotif("🗑️ Solicitud rechazada");}
function eliminarUsuario(u){if(!esAdmin()||u===usuarioActual)return;if(!usuarios[u])return;if(!confirm(`¿Eliminar definitivamente al usuario "${usuarios[u].nombre}" (@${u})?`))return;delete usuarios[u];db.ref("rastreador/usuarios").set(usuarios);mostrarNotif("🗑️ Usuario eliminado");}

function buscarResolucion(id){return resoluciones.find(x=>String(x.id||x.numero)===String(id));}
function abrirEditarEstablecimiento(id){if(!esAdmin())return;const r=buscarResolucion(id);if(!r)return;establecimientoEditando=id;document.getElementById("editEstab").value=r.estab||"";document.getElementById("modalEditarEstablecimiento").classList.add("show");}
function guardarEstablecimiento(){try{if(!esAdmin()||!establecimientoEditando)return;const nombre=document.getElementById("editEstab").value.trim();if(!nombre){mostrarNotif("❌ Escribe un nombre");return}const r=buscarResolucion(establecimientoEditando);if(!r)return;r.estab=nombre;db.ref("rastreador/resoluciones").set(resoluciones).then(()=>{cerrarModalEditarEstablecimiento();mostrarNotif("✅ Nombre actualizado");}).catch(err=>{console.error(err);mostrarNotif("❌ "+err.message);});}catch(e){console.error(e);mostrarNotif("❌ Error: "+e.message);}}
function cerrarModalEditarEstablecimiento(){document.getElementById("modalEditarEstablecimiento").classList.remove("show");establecimientoEditando=null;}

function abrirEditarUsuario(u){if(!esAdmin())return;usuarioEditando=u;document.getElementById("editUser").value=u;document.getElementById("editNombre").value=usuarios[u]?.nombre||"";document.getElementById("modalEditarUsuario").classList.add("show");}
function guardarNombreUsuario(){if(!esAdmin()||!usuarioEditando)return;const nombre=document.getElementById("editNombre").value.trim();if(!nombre){mostrarNotif("❌ Escribe un nombre");return}usuarios[usuarioEditando].nombre=nombre;db.ref("rastreador/usuarios").set(usuarios);cerrarModalEditar();mostrarNotif("✅ Nombre actualizado");}

function verHistorial(id){const r=buscarResolucion(id);if(!r)return;const hist=Array.isArray(r.historial)?r.historial:[];document.getElementById("historialTitulo").textContent="📜 Historial: "+esc(r.estab);document.getElementById("historialContenido").innerHTML=!hist.length?'<p>Sin historial</p>':hist.map((h,i)=>`<div class="history-item"><div class="history-dot"></div><div class="history-title">${h.nombrePaso||"Movimiento"}</div><div class="history-meta">👤 ${esc(h.usuario||"-")} · 🕒 ${esc(h.fecha||"-")}</div>${esAdmin()?`<button class="btn btn-danger" style="margin-top:8px;font-size:12px;padding:6px 10px" onclick="eliminarMovimiento('${safe(id)}',${i})">🗑️ Eliminar</button>`:""}</div>`).join("");document.getElementById("modalHistorial").classList.add("show");}
function eliminarMovimiento(id,idx){if(!esAdmin())return;const r=buscarResolucion(id);if(!r||!Array.isArray(r.historial)||!r.historial[idx])return;if(!confirm("¿Eliminar este movimiento?"))return;r.historial.splice(idx,1);r.fechas={};r.autores={};r.historial.forEach(m=>{if(m.paso!==undefined){r.fechas[m.paso]=m.fecha||"";r.autores[m.paso]=m.usuario||"";}});r.paso=r.historial.length?Number(r.historial[r.historial.length-1].paso||0):0;db.ref("rastreador/resoluciones").set(resoluciones).then(()=>{verHistorial(id);mostrarNotif("🗑️ Movimiento eliminado");}).catch(err=>{console.error(err);mostrarNotif("❌ "+err.message);});}

function abrirModalNueva(){document.getElementById("modalNueva").classList.add("show")}
function cerrarModalNueva(){document.getElementById("modalNueva").classList.remove("show")}
function cerrarModalEditar(){document.getElementById("modalEditarUsuario").classList.remove("show");usuarioEditando=null}
function cerrarModalHistorial(){document.getElementById("modalHistorial").classList.remove("show")}
function mostrarNotif(msg){const n=document.createElement("div");n.className="notif";n.textContent=msg;document.body.appendChild(n);setTimeout(()=>n.remove(),3200)}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function safe(v){return String(v??"").replace(/\\/g,"\\\\").replace(/'/g,"\\'")}

window.addEventListener("click",e=>{if(e.target.classList.contains("modal"))e.target.classList.remove("show");});
</script>
</body>
</html>
