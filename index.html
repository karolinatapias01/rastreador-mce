<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rastreador MCE</title>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #003366; color: #333; }
    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    .header { background: #003366; color: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; display: flex; justify-content: space-between; }
    .panel { background: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
    .btn { background: #003366; color: white; padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
    .btn:hover { background: #00264d; }
    .btn-danger { background: #dc2626; }
    .btn-danger:hover { background: #991b1b; }
    .btn-success { background: #059669; }
    .input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; }
    .res-item { background: #f5f5f5; padding: 15px; margin: 10px 0; border-radius: 5px; border-left: 4px solid #003366; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 999; }
    .modal.show { display: flex; }
    .modal-box { background: white; padding: 20px; border-radius: 10px; max-width: 400px; }
    .notif { position: fixed; top: 20px; right: 20px; background: #059669; color: white; padding: 15px; border-radius: 5px; z-index: 1000; }
  </style>
</head>
<body>
  <div class="container">
    <div id="authSection">
      <div class="panel">
        <h1>🔐 Rastreador MCE</h1>
        <div style="margin-top: 20px;">
          <input type="text" id="loginUser" class="input" placeholder="Usuario">
          <input type="password" id="loginPass" class="input" placeholder="Contraseña">
          <button class="btn" onclick="login()">Ingresar</button>
          <button class="btn" onclick="mostrarRegistro()" style="margin-left: 10px;">Registrarse</button>
          <div id="loginMsg" style="margin-top: 10px; color: red;"></div>
        </div>
      </div>
    </div>

    <div id="appSection" style="display: none;">
      <div class="header">
        <h1>🔴 Rastreador MCE</h1>
        <div>
          <span id="userInfo"></span>
          <button class="btn btn-danger" onclick="logout()" style="margin-left: 10px;">Cerrar</button>
        </div>
      </div>

      <div id="adminSection" style="display: none;">
        <div class="panel">
          <button class="btn btn-success" onclick="abrirModal()">➕ Nueva Resolución</button>
        </div>
      </div>

      <div class="panel">
        <input type="text" id="buscar" class="input" placeholder="🔍 Buscar..." onkeyup="renderizar()">
        <div id="lista"></div>
      </div>
    </div>
  </div>

  <div class="modal" id="modal">
    <div class="modal-box">
      <h2>Nuevo Establecimiento</h2>
      <input type="text" id="nombreEstab" class="input" placeholder="Nombre del establecimiento">
      <button class="btn btn-success" onclick="crearResolucion()" style="width: 100%;">Crear</button>
      <button class="btn" onclick="cerrarModal()" style="width: 100%; margin-top: 5px;">Cancelar</button>
    </div>
  </div>

  <script>
    const config = {
      apiKey: "AIzaSyCEvPVfN3-X4PIOfdwjgCHJB-D3bzndzHo",
      authDomain: "rastreador-mce-a3773.firebaseapp.com",
      databaseURL: "https://rastreador-mce-a3773-default-rtdb.firebaseio.com",
      projectId: "rastreador-mce-a3773",
      storageBucket: "rastreador-mce-a3773.firebasestorage.app",
      messagingSenderId: "998173497581",
      appId: "1:998173497581:web:721f95ce0785f3dccad4e4"
    };

    firebase.initializeApp(config);
    const db = firebase.database();

    let usuarios = {};
    let resoluciones = [];
    let usuarioActual = null;

    const PASOS = [
      { num: 0, nombre: "Omar sin elaborar", icon: "👨" },
      { num: 1, nombre: "Doctor Nilson", icon: "📋" },
      { num: 2, nombre: "Dirección", icon: "📂" },
      { num: 3, nombre: "Despacho", icon: "💼" },
      { num: 4, nombre: "Numeración", icon: "🔢" },
      { num: 5, nombre: "Secretaría", icon: "🏛️" },
      { num: 6, nombre: "Por Notificar", icon: "📧" },
      { num: 7, nombre: "Notificada", icon: "✅" }
    ];

    // Cargar usuarios
    db.ref("rastreador/usuarios").on("value", snap => {
      usuarios = snap.val() || {};
    });

    // Cargar resoluciones
    db.ref("rastreador/resoluciones").on("value", snap => {
      let data = snap.val() || [];
      resoluciones = Array.isArray(data) ? data : Object.values(data);
      if (usuarioActual) renderizar();
    });

    function ahora() {
      const d = new Date();
      const dd = String(d.getDate()).padStart(2, '0');
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const yyyy = d.getFullYear();
      const hh = String(d.getHours()).padStart(2, '0');
      const mn = String(d.getMinutes()).padStart(2, '0');
      return dd + "-" + mm + "-" + yyyy + " " + hh + ":" + mn;
    }

    function login() {
      const user = document.getElementById("loginUser").value.toLowerCase().trim();
      const pass = document.getElementById("loginPass").value;
      const msg = document.getElementById("loginMsg");

      msg.textContent = "";

      if (!user || !pass) {
        msg.textContent = "Completa usuario y contraseña";
        return;
      }

      if (!usuarios[user] || usuarios[user].pass !== pass) {
        msg.textContent = "Usuario o contraseña incorrectos";
        return;
      }

      usuarioActual = user;
      mostrarApp();
    }

    function mostrarRegistro() {
      const user = prompt("Usuario:");
      if (!user) return;
      const pass = prompt("Contraseña (mín 6 caracteres):");
      if (!pass || pass.length < 6) {
        alert("Contraseña muy corta");
        return;
      }
      const nombre = prompt("Nombre completo:");
      if (!nombre) return;

      const userLower = user.toLowerCase().trim();
      if (usuarios[userLower]) {
        alert("Este usuario ya existe");
        return;
      }

      if (Object.keys(usuarios).length === 0) {
        usuarios[userLower] = { nombre, pass, rol: "admin" };
        db.ref("rastreador/usuarios").set(usuarios);
        alert("¡Eres ADMIN! Inicia sesión.");
      } else {
        alert("Solicitud de registro enviada (pendiente de aprobación)");
      }
    }

    function logout() {
      usuarioActual = null;
      document.getElementById("authSection").style.display = "block";
      document.getElementById("appSection").style.display = "none";
      document.getElementById("loginUser").value = "";
      document.getElementById("loginPass").value = "";
    }

    function mostrarApp() {
      document.getElementById("authSection").style.display = "none";
      document.getElementById("appSection").style.display = "block";
      const usuario = usuarios[usuarioActual];
      const admin = usuario.rol === "admin" ? " (ADMIN)" : "";
      document.getElementById("userInfo").textContent = usuario.nombre + admin;
      document.getElementById("adminSection").style.display = usuario.rol === "admin" ? "block" : "none";
      renderizar();
    }

    function renderizar() {
      const lista = document.getElementById("lista");
      const buscar = (document.getElementById("buscar").value || "").toLowerCase();
      const filtradas = resoluciones.filter(r => 
        String(r.estab || "").toLowerCase().includes(buscar)
      );

      if (!filtradas.length) {
        lista.innerHTML = "<p>Sin resoluciones</p>";
        return;
      }

      const esAdmin = usuarios[usuarioActual].rol === "admin";
      lista.innerHTML = filtradas.map((r, idx) => {
        const paso = PASOS.find(p => p.num === Number(r.paso)) || PASOS[0];
        const fecha = r.fechas ? r.fechas[r.paso] : "-";

        let html = `
          <div class="res-item">
            <strong>${r.estab}</strong><br>
            ${paso.icon} ${paso.nombre}<br>
            Fecha: ${fecha}
        `;

        if (esAdmin) {
          html += '<br><br>';
          html += PASOS.map(p => 
            `<button class="btn" style="padding: 5px 10px; margin: 2px; ${p.num === Number(r.paso) ? 'background: #FFB81C; color: black;' : ''}" onclick="cambiarPaso(${idx}, ${p.num})">${p.icon}</button>`
          ).join('');
        }

        html += '</div>';
        return html;
      }).join('');
    }

    function crearResolucion() {
      const input = document.getElementById("nombreEstab");
      if (!input) {
        alert("Error: input no encontrado");
        return;
      }

      const estab = input.value.trim();
      if (!estab) {
        alert("Escribe el nombre del establecimiento");
        return;
      }

      const usuario = usuarios[usuarioActual];
      const fecha = ahora();
      const id = Date.now().toString();

      const nueva = {
        id,
        numero: "RES-" + id.slice(-6),
        estab,
        paso: 0,
        fechas: { 0: fecha },
        autores: { 0: usuario.nombre }
      };

      resoluciones.push(nueva);

      db.ref("rastreador/resoluciones").set(resoluciones)
        .then(() => {
          input.value = "";
          cerrarModal();
          mostrarNotif("✅ Creado");
          renderizar();
        })
        .catch(err => {
          alert("Error: " + err.message);
        });
    }

    function cambiarPaso(idx, paso) {
      const r = resoluciones[idx];
      const fecha = ahora();
      const usuario = usuarios[usuarioActual];

      r.paso = paso;
      r.fechas = r.fechas || {};
      r.autores = r.autores || {};
      r.fechas[paso] = fecha;
      r.autores[paso] = usuario.nombre;

      db.ref("rastreador/resoluciones").set(resoluciones)
        .then(() => {
          renderizar();
          mostrarNotif("✅ Actualizado");
        })
        .catch(err => alert("Error: " + err.message));
    }

    function abrirModal() {
      document.getElementById("modal").classList.add("show");
      document.getElementById("nombreEstab").value = "";
      document.getElementById("nombreEstab").focus();
    }

    function cerrarModal() {
      document.getElementById("modal").classList.remove("show");
    }

    function mostrarNotif(msg) {
      const div = document.createElement("div");
      div.className = "notif";
      div.textContent = msg;
      document.body.appendChild(div);
      setTimeout(() => div.remove(), 2000);
    }

    window.addEventListener("click", e => {
      if (e.target.id === "modal") cerrarModal();
    });
  </script>
</body>
</html>
